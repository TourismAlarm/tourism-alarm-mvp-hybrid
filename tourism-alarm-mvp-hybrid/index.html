<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tourism Alarm Catalunya — Mapa de saturación turística</title>
    <meta
      name="description"
      content="Mapa de presión turística de los 947 municipios de Catalunya a partir de datos oficiales del IDESCAT."
    />
    <link rel="icon" href="/assets/favicon.svg" />
  </head>
  <body>
    <div id="app">
      <div id="map"></div>

      <!-- Aviso de carga / error -->
      <div class="status" id="status" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span id="status-text">Cargando…</span>
      </div>

      <!-- Controles -->
      <div class="controls">
        <button id="btn-refresh" type="button" title="Volver a cargar los datos">🔄 Actualizar</button>
        <button id="btn-reset" type="button" title="Volver a la vista de Catalunya">🗺️ Catalunya</button>
      </div>

      <!-- Panel principal -->
      <aside class="panel info-panel">
        <header>
          <span class="mark" aria-hidden="true">🚨</span>
          <h2>Tourism Alarm</h2>
        </header>
        <p class="subtitle">Presión turística por municipio · Catalunya</p>

        <section class="section" style="border-top: none; padding-top: 0; margin-top: 0;">
          <h3>Mes de referencia</h3>
          <div class="month-control">
            <input
              id="month-slider"
              type="range"
              min="1"
              max="12"
              step="1"
              value="1"
              aria-label="Mes de referencia"
            />
            <span class="month-name" id="month-name">—</span>
          </div>
          <span class="season-badge" id="season-badge">—</span>
          <p class="season-note" id="season-note"></p>
        </section>

        <section class="section">
          <h3>Resumen</h3>
          <div class="stat-row">
            <span class="label">Municipios</span>
            <span class="value" id="stat-total">—</span>
          </div>
          <div class="stat-row">
            <span class="label">Con plazas turísticas</span>
            <span class="value" id="stat-with-data">—</span>
          </div>
          <div class="stat-row">
            <span class="label">Plazas registradas</span>
            <span class="value" id="stat-places">—</span>
          </div>
          <div class="stat-row">
            <span class="label">Presión media</span>
            <span class="value" id="stat-average">—</span>
          </div>
          <div class="stat-row">
            <span class="label">En nivel crítico</span>
            <span class="value" id="stat-critical">—</span>
          </div>
        </section>

        <section class="section">
          <h3>Mayor presión este mes</h3>
          <div class="top-list" id="top-list"></div>
        </section>
      </aside>

      <!-- Leyenda -->
      <aside class="panel legend">
        <h3>Nivel de saturación</h3>
        <div id="legend-items"></div>
        <div class="legend-footer">
          <div id="legend-coverage">—</div>
          <div>Datos IDESCAT · <span id="legend-updated">—</span></div>
        </div>
      </aside>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
