<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tourism Alarm Catalunya — Saturación turística hoy y mañana</title>
    <meta
      name="description"
      content="Cuánta gente hay hoy y mañana en cada municipio de Catalunya, y a qué playa ir: datos del IDESCAT y previsión de Open-Meteo."
    />
    <link rel="icon" href="/assets/favicon.svg" />
  </head>
  <body>
    <div id="app">
      <div id="map"></div>

      <div class="status" id="status" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span id="status-text">Cargando…</span>
      </div>

      <div class="controls">
        <button id="btn-refresh" type="button" title="Volver a cargar los datos">🔄 Actualizar</button>
        <button id="btn-reset" type="button" title="Volver a la vista de Catalunya">🗺️ Catalunya</button>
      </div>

      <aside class="panel info-panel">
        <header>
          <span class="mark" aria-hidden="true">🚨</span>
          <h2>Tourism Alarm</h2>
        </header>
        <p class="subtitle">Cuánta gente hay en Catalunya, hoy y mañana</p>

        <div class="day-tabs" role="tablist" aria-label="Día">
          <button class="day-tab active" type="button" role="tab" data-day="0" aria-selected="true">Hoy</button>
          <button class="day-tab" type="button" role="tab" data-day="1" aria-selected="false">Mañana</button>
        </div>
        <p class="day-date" id="day-date">—</p>
        <p class="day-note" id="day-note"></p>

        <section class="section">
          <h3>🏖️ Mejores playas</h3>
          <div class="rank-list" id="beach-list"></div>
          <p class="hint" id="beach-note"></p>
        </section>

        <section class="section">
          <h3>Más saturados</h3>
          <div class="rank-list" id="busiest-list"></div>
        </section>

        <section class="section">
          <div class="stat-row">
            <span class="label">En nivel crítico</span>
            <span class="value" id="stat-critical">—</span>
          </div>
          <div class="stat-row">
            <span class="label">Afluencia media</span>
            <span class="value" id="stat-average">—</span>
          </div>
          <div class="stat-row">
            <span class="label">Municipios con playa</span>
            <span class="value" id="stat-coastal">—</span>
          </div>
        </section>
      </aside>

      <aside class="panel legend">
        <h3>Afluencia prevista</h3>
        <div id="legend-items"></div>
        <div class="legend-footer">
          <div id="legend-coverage">—</div>
          <div id="weather-status">—</div>
        </div>
      </aside>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
