<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revisión · Tourism Alarm</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/assets/favicon.svg" />
  </head>
  <body class="review-body">
    <!-- Acceso -->
    <div class="login" id="login" hidden>
      <form class="login-card" id="login-form">
        <h1>🚨 Revisión</h1>
        <p class="login-note">
          Esta página no muestra nada sin sesión: las políticas de la base de
          datos rechazan cualquier lectura anónima.
        </p>
        <label>
          Correo
          <input type="email" id="email" autocomplete="username" required />
        </label>
        <label>
          Contraseña
          <input type="password" id="password" autocomplete="current-password" required />
        </label>
        <button type="submit" id="login-button">Entrar</button>
        <p class="login-error" id="login-error"></p>
      </form>
    </div>

    <!-- Panel -->
    <div class="review" id="review" hidden>
      <header class="review-header">
        <div>
          <h1>🚨 Cola de revisión</h1>
          <p class="review-sub" id="review-sub">—</p>
        </div>
        <div class="review-actions">
          <a class="ghost" href="/">Ver el mapa</a>
          <button type="button" class="ghost" id="btn-reload">Recargar</button>
          <button type="button" class="ghost" id="btn-logout">Salir</button>
        </div>
      </header>

      <div class="review-status" id="review-status" hidden></div>

      <main class="review-main">
        <section>
          <h2>Señales pendientes</h2>
          <div id="queue"></div>
        </section>

        <section>
          <h2>Agentes</h2>
          <div class="sources" id="sources"></div>
          <h3>Últimas ejecuciones</h3>
          <div class="runs" id="runs"></div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/review.js"></script>
  </body>
</html>
